<style>
/* Layout: 회색 종이 위 로고 → 보라·연두 물결 판 안에 칸막이 박스와 레트로 창. 한 칼럼, 최대 560px */
@font-face { font-family: "Galmuri11"; src: url("fonts/Galmuri11.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Galmuri11"; src: url("fonts/Galmuri11-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Galmuri14"; src: url("fonts/Galmuri14.woff2") format("woff2"); font-display: swap; }
:root {
  --paper: #e8e7e3;
  --box: #ecebe7;
  --win: #dcdcd9;
  --winbar: #c9c9c5;
  --ink: #222222;
  --muted: #6f6d68;
  --purple: #8f6fdc;
  --purple-deep: #5a3fb0;
  --lav: #b9a2f0;
  --lav-soft: #e2d8f8;
  --mint: #b5ee9c;
  --green-ink: #2f4a26;
  --danger: #b0392f;
  --f-pixel: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  --f-pixel-big: "Galmuri14", "Galmuri11", "Apple SD Gothic Neo", monospace;
  --f-chrome: "Syncopate", "Arial Black", sans-serif;
  --f-lcd: "VT323", "Courier New", monospace;
  --f-label: "Silkscreen", "Galmuri11", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--paper); overflow-x: hidden; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-pixel); font-size: 13px; line-height: 1.7;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: .45; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.wrap { max-width: 560px; margin: 0 auto; position: relative; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }

/* ---------- 머리 ---------- */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 4px 0 12px; }
.logo { display: block; width: min(52vw, 230px); flex-shrink: 0; }
.logo img { display: block; width: 100%; filter: drop-shadow(0 2px 0 rgba(34,34,34,.12)); }
.top-info { font-family: var(--f-label); font-size: 10px; line-height: 1.7; text-align: right; padding-top: 14px; letter-spacing: .02em; min-width: 0; }
.top-info b { font-weight: 400; }

/* ---------- 레트로 창 ---------- */
.win { position: relative; background: var(--win); border: 1.5px solid var(--ink); box-shadow: 4px 4px 0 rgba(34,34,34,.18); }
.wbar { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; border-bottom: 1.5px solid var(--ink); background: var(--winbar); min-height: 21px; }
.wbar span { font-family: var(--f-label); font-size: 10px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wbar i { display: flex; gap: 3px; font-style: normal; margin-left: auto; }
.wbar i b { width: 12px; height: 11px; border: 1.2px solid var(--ink); background: #ecebe8; }
.win-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.win-title { font-family: var(--f-lcd); font-size: 26px; line-height: 1; letter-spacing: .02em; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; text-decoration: none;
  background: #f2f1ee; border: 1.5px solid var(--ink); padding: 5px 13px; font-family: var(--f-pixel); font-size: 12px; line-height: 1.3;
  box-shadow: inset -2px -2px 0 #bdbcb8; color: var(--ink); }
.btn:active { box-shadow: inset 2px 2px 0 #bdbcb8; }
.btn.on, .btn.g { background: var(--mint); box-shadow: inset -2px -2px 0 #8fc879; }
.btn.p { background: var(--lav); box-shadow: inset -2px -2px 0 #9479d8; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.sm { padding: 3px 9px; font-size: 11px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, .inp:focus-visible, a:focus-visible, label.file:focus-within { outline: 2px solid var(--purple-deep); outline-offset: 2px; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav .btn[data-tab] { font-family: var(--f-label); font-size: 12px; letter-spacing: .06em; min-width: 52px; }
.btn.sound { font-family: var(--f-label); font-size: 10px; letter-spacing: .04em; gap: 6px; }
.btn.sound[aria-pressed="true"] { background: var(--lav); box-shadow: inset -2px -2px 0 #9479d8; }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
.eq i { width: 3px; height: 3px; background: var(--ink); }
.btn.sound[aria-pressed="true"] .eq i { animation: eq .9s steps(4) infinite; }
.btn.sound[aria-pressed="true"] .eq i:nth-child(2) { animation-delay: -.3s; }
.btn.sound[aria-pressed="true"] .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0% { height: 3px; } 25% { height: 11px; } 50% { height: 6px; } 75% { height: 9px; } 100% { height: 3px; } }
@media (prefers-reduced-motion: reduce) { .btn.sound[aria-pressed="true"] .eq i { animation: none; height: 8px; } }

/* ---------- 물결 판 ---------- */
.stage { position: relative; margin-top: 14px; border: 1.5px solid transparent;
  background: #ecebe6 url("assets/bg.jpg") center top / 100% auto repeat-y; padding: 20px 18px 26px; display: flex; flex-direction: column; gap: 16px; }
.view { display: flex; flex-direction: column; gap: 16px; position: relative; }
.sticker { position: absolute; z-index: 6; pointer-events: none; filter: drop-shadow(3px 5px 4px rgba(60,40,100,.28)); }
.heart { display: block; width: 150px; height: auto; overflow: visible; margin: -6px auto -10px; }

/* ---------- 박스 ---------- */
.box { position: relative; background: var(--box); border: 1.5px solid var(--ink); }
.box.pad { padding: 12px 14px; }
.box.mint { background: var(--mint); }
.lcd { font-family: var(--f-lcd); line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.label { font-family: var(--f-label); font-size: 10px; letter-spacing: .04em; }
.muted { color: var(--muted); }
.body { margin: 0; white-space: pre-wrap; min-width: 0; }

/* 크롬 영문 제목 · 픽셀 한글 제목 */
.chrome { font-family: var(--f-chrome); font-weight: 700; text-transform: uppercase; line-height: 1; letter-spacing: -.02em; margin: 0;
  background: linear-gradient(180deg, #ffffff 0%, #d9ffcb 30%, #8fdc78 52%, #f2fff0 56%, #b5ee9c 80%, #ffffff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1.3px var(--green-ink);
  filter: drop-shadow(2px 2px 0 var(--green-ink)); }
.view > .chrome { font-size: clamp(32px, 10vw, 44px); }
.chrome i { font-style: normal; display: block;
  background: linear-gradient(180deg, #ffffff 0%, #e6dcff 30%, #9b78ec 52%, #f4f0ff 56%, #b9a2f0 80%, #ffffff 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-stroke: 1.3px #3a2a6e; }
.ktitle { font-family: var(--f-pixel-big); font-weight: 400; color: #c9f5b4; -webkit-text-stroke: 5px var(--green-ink); paint-order: stroke fill;
  text-shadow: 3px 3px 0 var(--green-ink); line-height: 1.25; margin: 0; text-wrap: balance; }

/* ---------- 사진 칸 ---------- */
.pgrid { display: grid; gap: 10px; }
.pgrid .ph { position: relative; border: 1.5px solid var(--ink); background: var(--lav-soft); overflow: hidden; min-height: 0; }
.pgrid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pgrid.n1 .ph { aspect-ratio: 4 / 3; }
.pgrid.n2 { grid-template-columns: 1fr 1fr; }
.pgrid.n2 .ph { aspect-ratio: 3 / 4; }
.pgrid.n3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 1 / 1; }
.pgrid.n3 .ph:nth-child(1) { grid-row: 1; grid-column: 1; }
.pgrid.n3 .ph:nth-child(2) { grid-row: 2; grid-column: 1; }
.pgrid.n3 .ph:nth-child(3) { grid-row: 1 / 3; grid-column: 2; }
.more-ph { position: absolute; right: 6px; bottom: 6px; background: var(--ink); color: #fff; font-family: var(--f-lcd); font-size: 18px; padding: 0 6px; }
.blank-ph { aspect-ratio: 16 / 7; border: 1.5px solid var(--ink); display: flex; align-items: center; justify-content: center; padding: 16px;
  background: linear-gradient(160deg, var(--lav-soft), #d9f5cc); }
.blank-ph span { font-family: var(--f-pixel-big); font-size: 15px; text-align: center; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- 글 카드 ---------- */
.posts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 22px; }
.post-card { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; position: relative; }
.post-card .overlay { position: absolute; right: 12px; bottom: 12px; z-index: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; max-width: 82%; pointer-events: none; }
.post-card .overlay .chrome { font-size: clamp(28px, 9vw, 40px); }
.post-card .overlay .ktitle { font-size: clamp(17px, 5.2vw, 22px); }
.post-card .info { display: flex; flex-direction: column; gap: 6px; }
.post-card .info .lcd { font-size: clamp(26px, 8vw, 34px); }
.post-card .excerpt { margin: 0; font-size: 12px; line-height: 1.65; color: #444; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-card .meta { display: flex; gap: 10px; }
.post-card:hover .box { background: #f3f2ee; }
.post-card .titleline { font-family: var(--f-pixel); font-weight: 700; font-size: 15px; }

/* ---------- 글 보기 ---------- */
.article-title { position: relative; z-index: 3; margin-top: -48px; padding: 0 8px; font-size: clamp(24px, 7.5vw, 32px); transform: rotate(-2deg); }
.article-title.solo { margin-top: 0; }
.article .lcd.date { font-size: clamp(26px, 8vw, 32px); }
.article .body { font-size: 13px; line-height: 1.85; color: #2c2c2c; margin-top: 8px; }
.photos-all { display: flex; flex-direction: column; gap: 10px; }
.photos-all img { width: 100%; height: auto; display: block; border: 1.5px solid var(--ink); background: var(--lav-soft); }

/* ---------- 댓글 · 방명록 ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.chead { font-family: var(--f-lcd); font-size: 22px; line-height: 1; padding: 6px 12px; border-bottom: 1.5px solid var(--ink); background: var(--mint); display: flex; justify-content: space-between; align-items: center; }
.citem { padding: 8px 12px; border-bottom: 1px dashed #9a9893; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.citem.mine { background: var(--lav-soft); }
.citem.sub { padding-left: 30px; position: relative; }
.citem.sub::before { content: "↳"; position: absolute; left: 12px; top: 8px; font-family: var(--f-lcd); font-size: 16px; color: var(--muted); }
.citem.mine .who::after { content: "WRITER"; font-family: var(--f-label); font-size: 9px; border: 1px solid var(--purple-deep); color: var(--purple-deep); padding: 0 4px; margin-left: 6px; vertical-align: 1px; font-weight: 400; }
.reply-form { margin-top: 6px; padding: 8px; border: 1.2px dashed var(--ink); background: #f3f2ee; }
.citem .who { font-weight: 700; }
.citem.mine .who { color: var(--purple-deep); }
.citem .row1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.citem .lcd { font-size: 15px; color: var(--muted); }

.gb-list { display: flex; flex-direction: column; gap: 12px; }
.gb-item { display: flex; flex-direction: column; gap: 6px; }
.gb-item .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.gb-item .who { font-weight: 700; font-size: 13px; }
.gb-item .lcd { font-size: 16px; white-space: nowrap; }
.gb-item.hidden-item { opacity: .55; border-style: dashed; }
.reply { padding: 6px 9px; background: var(--lav-soft); border: 1.2px solid var(--ink); font-size: 12px; }
.reply b { color: var(--purple-deep); margin-right: 4px; }
.locked { color: #3b5a32; font-size: 12px; margin: 0; }
.tag { font-family: var(--f-label); font-size: 9px; border: 1px solid var(--ink); padding: 0 5px; margin-left: 4px; vertical-align: 1px; }

/* ---------- 입력 ---------- */
.inp { width: 100%; background: #f6f5f2; border: 1.5px solid var(--ink); padding: 7px 9px; font-size: 12px; font-family: var(--f-pixel); border-radius: 0; }
.inp::placeholder { color: #8a8985; }
textarea.inp { min-height: 84px; resize: vertical; line-height: 1.6; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row > * { flex: 1 1 120px; min-width: 0; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.check { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; cursor: pointer; }
.check input { accent-color: var(--purple); width: 14px; height: 14px; margin: 0; }
.count { font-family: var(--f-lcd); font-size: 15px; color: var(--muted); }
.msg { font-size: 11px; margin: 0; min-height: 1.3em; }
.msg.err { color: var(--danger); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.inline { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.inline .inp { flex: 1 1 120px; padding: 5px 8px; }
.inline textarea.inp { flex-basis: 100%; min-height: 70px; }
.acts { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.empty { text-align: center; padding: 26px 12px; margin: 0; font-size: 12px; }
.more { align-self: center; }

/* ---------- 작품 목록: CD 케이스 ---------- */
.works { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 26px; }
.work a, .work .wrapcd { display: block; text-decoration: none; color: inherit; }
.cdrow { position: relative; height: 196px; }
.cdcase { position: absolute; left: 0; top: 0; width: 196px; height: 196px; z-index: 2; border: 1.5px solid var(--ink);
  background: var(--cv, linear-gradient(150deg, #e6dcff, #9b78ec 70%, #5a3fb0)); box-shadow: 5px 5px 0 rgba(34,34,34,.22); overflow: hidden; }
.cdcase::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: rgba(20,16,40,.82);
  background-image: repeating-linear-gradient(180deg, transparent 0 22px, rgba(255,255,255,.35) 22px 24px); border-right: 1.5px solid var(--ink); }
.cdcase::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(125deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 60%, rgba(255,255,255,.28) 72%, rgba(255,255,255,0) 86%); }
.cdcase .cover { position: absolute; left: 16px; right: 0; top: 0; bottom: 0; padding: 12px 12px 10px 14px; display: flex; flex-direction: column; justify-content: space-between; }
.cdcase .vol { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-label); font-size: 9px; letter-spacing: .06em; color: #1d1630; }
.cdcase .vol b { font-family: var(--f-lcd); font-weight: 400; font-size: 18px; }
.cdcase .ktitle { font-size: 23px; line-height: 1.15; }
.cdcase .brand { font-family: var(--f-chrome); font-size: 9px; letter-spacing: .12em; color: #1d1630; opacity: .75; }
.cdcase .deco { position: absolute; pointer-events: none; background: var(--dc, #fff);
  -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
.cdcase .cover > * { position: relative; z-index: 1; }
.cdcase .cover .deco { position: absolute; z-index: 0; }
.work.peek .cdcase .deco.float { animation: floaty 2.6s ease-in-out infinite; }
@keyframes floaty { 0%,100% { translate: 0 0; } 50% { translate: 0 -4px; } }
.disc { position: absolute; left: 70px; top: 8px; width: 180px; height: 180px; border-radius: 50%; z-index: 1;
  background:
    radial-gradient(circle, transparent 0 11px, #d9d6e6 11px 13px, rgba(255,255,255,.9) 13px 30px, transparent 30px),
    repeating-radial-gradient(circle, rgba(255,255,255,.18) 0 1px, transparent 1px 4px),
    conic-gradient(from 20deg, #ffc2e4, #c6b3ff, #9fd4ff, #b5ee9c, #fff4b0, #ffc2e4, #c6b3ff, #9fd4ff, #b5ee9c, #ffc2e4);
  border: 1.5px solid var(--ink); box-shadow: 3px 3px 0 rgba(34,34,34,.18);
  transition: transform .6s cubic-bezier(.2,.7,.2,1); }
.disc::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--ink); }
.work.peek .disc { transform: translateX(48px) rotate(140deg); }
.cdrow:focus-visible { outline: 2px solid var(--purple-deep); outline-offset: 4px; }
.work.spin .disc { animation: spin 2.4s linear infinite; }
@keyframes spin { from { transform: translateX(48px) rotate(0); } to { transform: translateX(48px) rotate(360deg); } }
.cdinfo { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.cdinfo .left { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.track { font-family: var(--f-lcd); font-size: 20px; line-height: 1; }
.chip { font-family: var(--f-label); font-size: 10px; letter-spacing: .04em; border: 1.2px solid var(--ink); padding: 1px 7px; background: var(--box); }
.chip.done { background: var(--lav); color: #1d1630; }
.chip.ing { background: var(--mint); color: #1b2a16; }
.chip.short { background: var(--mint); color: #1b2a16; }
.chip.ing::before { content: "●"; margin-right: 4px; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.work .desc { margin: 8px 0 0; font-size: 12px; line-height: 1.7; }
.work .go.off { opacity: .55; }
.nowplaying { margin-top: 12px; }
.nowplaying .win-body { gap: 6px; }
.ytbox { position: relative; width: 100%; height: 0; padding-bottom: max(56.25%, 200px); min-height: 200px; background: #000; border: 1.5px solid var(--ink); }
.ytbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.cv-purple { --cv: linear-gradient(150deg, #efe7ff 0%, #b9a2f0 45%, #7f58e0 100%); }
.cv-green { --cv: linear-gradient(150deg, #f2ffe9 0%, #b5ee9c 45%, #5fbf5a 100%); }
.cv-blue { --cv: linear-gradient(150deg, #eef6ff 0%, #9fd4ff 45%, #3a8bff 100%); }
.cv-pink { --cv: linear-gradient(150deg, #fff0f7 0%, #ffc2e4 45%, #e86aa8 100%); }
@media (prefers-reduced-motion: reduce) { .chip.ing::before, .work.spin .disc { animation: none; } .disc { transition: none; } }

/* ---------- 반짝이 커서 ---------- */
.spark { position: fixed; left: 0; top: 0; z-index: 120; pointer-events: none; filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 3px rgba(90,63,176,.6));
  animation: spark var(--t, .75s) ease-out forwards; }
.spark i { display: block; width: var(--s, 12px); height: var(--s, 12px); background: var(--c, #8f6fdc);
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }

/* 사진을 1600px 이하 JPG 로 줄여서 올려요 */
async function shrink(file) {
  if (file.type === "image/gif") return file;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return (await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85))) || file;
  } catch { return file; }
}

function samplePhoto(a, b, glow) {
  const c = document.createElement("canvas"); c.width = 800; c.height = 800;
  const g = c.getContext("2d");
  const lin = g.createLinearGradient(0, 0, 300, 800); lin.addColorStop(0, a); lin.addColorStop(1, b);
  g.fillStyle = lin; g.fillRect(0, 0, 800, 800);
  [[560, 260, 170, glow], [200, 560, 220, "rgba(255,255,255,.35)"], [150, 180, 40, "rgba(255,250,230,.9)"]].forEach(([x, y, r, col]) => {
    const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = rg; g.fillRect(0, 0, 800, 800);
  });
  return c.toDataURL("image/jpeg", 0.8);
}

/* ---------- 저장소: Supabase ---------- */
function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.append(s); }); }
async function supabaseApi() {
  await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js");
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  const rpc = async (fn, args) => ok(await sb.rpc(fn, args));
  const store = sb.storage.from(BUCKET);
  const pathOf = (url) => { const i = url.indexOf("/" + BUCKET + "/"); return i < 0 ? null : decodeURIComponent(url.slice(i + BUCKET.length + 2)); };
  return {
    demo: false,
    listPosts: (before) => rpc("p_list", { p_limit: PAGE, p_before: before ?? null }),
    getPost: async (id) => ok(await sb.from("posts").select("*").eq("id", id).maybeSingle()),
    async savePost({ id, title, body, images }) {
      if (id) { ok(await sb.from("posts").update({ title, body, images, updated_at: new Date().toISOString() }).eq("id", id)); return id; }
      return ok(await sb.from("posts").insert({ title, body, images }).select("id").single()).id;
    },
    async deletePost(id) { const p = await this.getPost(id); ok(await sb.from("posts").delete().eq("id", id)); if (p && p.images.length) await this.removeImages(p.images); },
    async uploadImage(file) {
      const blob = await shrink(file);
      const ext = blob.type === "image/gif" ? "gif" : blob.type === "image/png" ? "png" : "jpg";
      const path = new Date().toISOString().slice(0, 7) + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
      ok(await store.upload(path, blob, { contentType: blob.type || "image/jpeg", cacheControl: "31536000" }));
      return store.getPublicUrl(path).data.publicUrl;
    },
    async removeImages(urls) { const paths = urls.map(pathOf).filter(Boolean); if (paths.length) await store.remove(paths); },
    listComments: (postId) => rpc("c_list", { p_post_id: postId }),
    addComment: ({ postId, nickname, password, content, parentId }) => rpc("c_add", Object.assign({ p_post_id: postId, p_nickname: nickname, p_password: password, p_content: content }, parentId != null ? { p_parent_id: parentId } : {})),
    deleteComment: (id, pw) => rpc("c_delete", { p_id: id, p_password: pw }),
    authorComment: (postId, content, parentId) => rpc("c_author_add", Object.assign({ p_post_id: postId, p_content: content }, parentId != null ? { p_parent_id: parentId } : {})),
    adminDeleteComment: (id) => rpc("c_admin_delete", { p_id: id }),
    gbList: (before) => rpc("gb_list", { p_limit: PAGE, p_before: before ?? null }),
    gbAdd: ({ nickname, password, content, secret }) => rpc("gb_add", { p_nickname: nickname, p_password: password, p_content: content, p_secret: secret }),
    gbDelete: (id, pw) => rpc("gb_delete", { p_id: id, p_password: pw }),
    gbOpen: async (id, pw) => { const d = await rpc("gb_open", { p_id: id, p_password: pw }); return d && d.length ? d[0] : null; },
    gbReply: (id, text) => rpc("gb_reply", { p_id: id, p_reply: text }),
    gbHide: (id, v) => rpc("gb_set_hidden", { p_id: id, p_hidden: v }),
    gbAdminDelete: (id) => rpc("gb_admin_delete", { p_id: id }),
    async login(email, pw) { ok(await sb.auth.signInWithPassword({ email, password: pw })); return this.isAdmin(); },
    async logout() { await sb.auth.signOut(); },
    async isAdmin() { const { data } = await sb.auth.getSession(); if (!data.session) return false; return !!(await rpc("is_admin")); },
  };
}

/* ---------- 소리: 배경음악 + 8비트 효과음 ---------- */
const Sound = (() => {
  let on = true, ctx = null, started = false;
  try { on = localStorage.getItem("mt-sound") !== "off"; } catch {}
  const bgm = () => $("bgm");
  const ac = () => { if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); } if (ctx && ctx.state === "suspended") ctx.resume(); return ctx; };
  function tone(freqs, step = 0.055, type = "square", vol = 0.06) {
    if (!on) return; const c = ac(); if (!c) return;
    const t0 = c.currentTime + 0.005;
    freqs.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0 + i * step);
      g.gain.setValueAtTime(0, t0 + i * step); g.gain.linearRampToValueAtTime(vol, t0 + i * step + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * step + step * 0.95);
      o.connect(g).connect(c.destination); o.start(t0 + i * step); o.stop(t0 + (i + 1) * step);
    });
  }
  const sfx = {
    click: () => tone([880], 0.05),
    nav: () => tone([660, 990], 0.05),
    send: () => tone([988, 1319], 0.07),            // 코인 소리
    open: () => tone([523, 659, 784], 0.045),
    del: () => tone([392, 262], 0.08, "square", 0.05),
    error: () => tone([196, 147], 0.1, "square", 0.05),
  };
  function ui() {
    const b = $("soundBtn"); if (!b) return;
    const playing = on && started && !bgm().paused;
    b.setAttribute("aria-pressed", String(playing));
    $("soundLabel").textContent = playing ? "NOW PLAYING" : on ? "BGM ▶" : "BGM OFF";
  }
  async function play() { try { await bgm().play(); started = true; } catch {} ui(); }
  function set(v) {
    on = v; try { localStorage.setItem("mt-sound", v ? "on" : "off"); } catch {}
    if (v) play(); else { bgm().pause(); } ui();
  }
  function init() {
    const a = bgm(); a.volume = 0.45;
    a.addEventListener("play", ui); a.addEventListener("pause", ui);
    $("soundBtn").addEventListener("click", (e) => { e.stopPropagation(); const playing = on && started && !a.paused; if (playing) set(false); else { set(true); sfx.open(); } });
    // 처음 아무 곳이나 누르면 음악 시작 (꺼 두었으면 그대로)
    const first = () => { if (on && !started) play(); };
    document.addEventListener("pointerdown", first, { once: true });
    document.addEventListener("keydown", first, { once: true });
    // 버튼·링크 누를 때 효과음
    document.addEventListener("click", (e) => {
      const t = e.target.closest("a, button, label.file, input[type=checkbox]");
      if (!t || t.id === "soundBtn") return;
      if (t.matches("[data-tab], .logo, .post-card, .btn[href^='#']")) sfx.nav();
      else if (t.matches("button[type=submit]")) sfx.send();
      else if (t.matches(".danger")) sfx.del();
      else sfx.click();
    }, true);
    ui();
  }
  // 다른 음악(작품 CD)이 나올 때 배경음악 잠깐 멈추기
  function duck() { const a = bgm(); const was = !a.paused; a.pause(); ui(); return was; }
  function unduck(was) { if (was && on) play(); }
  return { init, sfx, start: () => set(true), mute: () => set(false), isOn: () => on, duck, unduck };
})();

function inlinePrompt(container, { placeholder, type = "password", multiline = false, value = "", okLabel, okClass = "", onOk }) {
  container.textContent = "";
  const box = el("div", "inline");
  const input = el(multiline ? "textarea" : "input", "inp");
  if (!multiline) input.type = type;
  input.placeholder = placeholder; input.value = value;

  const msg = el("p", "msg err");

}

/* ---------- 반짝이 커서 (마우스·손가락 지나간 자리에 별) ---------- */
(function sparkles() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#8f6fdc", "#b5ee9c", "#ffffff", "#b9a2f0", "#ffc2e4", "#8fc8ff"];
  let live = 0, last = 0;
  const spawn = (x, y, burst) => {
    if (live > 40) return;
    const sp = document.createElement("span"); sp.className = "spark"; sp.setAttribute("aria-hidden", "true");
    const r = (a, b) => a + Math.random() * (b - a);
    const size = burst ? r(14, 24) : r(10, 18);
    sp.style.cssText = `--x:${x - size / 2 + r(-6, 6)}px;--y:${y - size / 2 + r(-6, 6)}px;--dx:${burst ? r(-40, 40) : r(-12, 12)}px;--dy:${burst ? r(-40, 30) : r(8, 26)}px;--s:${size}px;--c:${colors[Math.floor(Math.random() * colors.length)]};--t:${r(.55, .9)}s`;
    sp.append(document.createElement("i"));
    live++; document.body.append(sp);
    sp.addEventListener("animationend", () => { sp.remove(); live--; }, { once: true });
  };
  const trail = (x, y) => { const now = performance.now(); if (now - last < 32) return; last = now; spawn(x, y, false); };
  document.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") trail(e.clientX, e.clientY); }, { passive: true });
  document.addEventListener("touchmove", (e) => { const t = e.touches[0]; if (t) trail(t.clientX, t.clientY); }, { passive: true });
  document.addEventListener("pointerdown", (e) => { for (let k = 0; k < 6; k++) spawn(e.clientX, e.clientY, true); }, { passive: true });
})();

/* ---------- 사진 크게 보기 ---------- */
function openViewer(images, start, title) {
  let i = start;
  const ov = el("div", "viewer"); ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "사진 크게 보기");
  const w = el("section", "win");
  const bar = el("div", "wbar"); const name = el("span"); const close = btn("X", "vclose"); close.setAttribute("aria-label", "닫기");
  bar.append(name, close);
  const stage = el("div", "vstage"); const img = el("img"); stage.append(img);
  const foot = el("div", "vfoot");
  const prev = btn("◀ PREV", "sm"), next = btn("NEXT ▶", "sm"), count = el("span", "lcd");
  const hint = el("span", "hint", "사진을 누르면 실제 크기로 봐요");
  const mid = el("div"); mid.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:2px"; mid.append(count, hint);
  foot.append(prev, mid, next);
  w.append(bar, stage, foot); ov.append(w);
  const show = () => {
    stage.classList.remove("actual"); stage.scrollTo(0, 0);
    img.src = images[i]; img.alt = title + " 사진 " + (i + 1);
    name.textContent = "IMG_" + String(i + 1).padStart(3, "0") + ".JPG";
    count.textContent = (i + 1) + " / " + images.length;
    prev.disabled = i === 0; next.disabled = i === images.length - 1;
    prev.style.visibility = next.style.visibility = images.length > 1 ? "visible" : "hidden";
  };
  const go = (d) => { const n = i + d; if (n < 0 || n >= images.length) return; i = n; Sound.sfx.click(); show(); };
  const shut = () => { ov.remove(); document.body.classList.remove("viewer-open"); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") shut(); else if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1); };
  prev.onclick = () => go(-1); next.onclick = () => go(1); close.onclick = shut;
  ov.addEventListener("click", (e) => { if (e.target === ov) shut(); });
  img.addEventListener("click", () => { stage.classList.toggle("actual"); });
  // 휴대폰: 옆으로 밀어서 넘기기
  let sx = null, sy = 0;
  stage.addEventListener("touchstart", (e) => { if (e.touches.length === 1 && !stage.classList.contains("actual")) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (sx == null) return; const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  });
  document.addEventListener("keydown", onKey);
  document.body.append(ov); document.body.classList.add("viewer-open");
  show(); close.focus();
}

  const original = [...post.images];
  let images = [...post.images];

  const back = el("a", "btn sm", id ? "← 글로 돌아가기" : "← 글 목록"); back.href = id ? "#post-" + id : "#posts"; back.style.alignSelf = "flex-start";

  const title = el("input", "inp"); title.type = "text"; title.id = "pTitle"; title.maxLength = 100; title.placeholder = "제목"; title.value = post.title;
  const bodyIn = el("textarea", "inp"); bodyIn.id = "pBody"; bodyIn.maxLength = 20000; bodyIn.placeholder = "내용"; bodyIn.value = post.body;
  const pics = el("div", "pics");
  const fileLabel = el("label", "btn sm file"); const fileInput = el("input"); fileInput.type = "file"; fileInput.accept = "image/*"; fileInput.multiple = true; fileInput.id = "pFiles";
  fileLabel.append(fileInput, "사진 추가");
  const picNote = el("span", "count");
  const picRow = el("div", "acts"); picRow.append(fileLabel, picNote);
  const foot = el("div", "foot"); const msg = el("p", "msg err"); const sub = el("button", "btn g", id ? "수정 저장" : "올리기"); sub.type = "submit";
  foot.append(msg, sub);
  f.append(title, bodyIn, picRow, pics, foot);
  body.append(f); v.append(w);

  const drawPics = () => {
    pics.textContent = "";
    images.forEach((u, i) => { const d = el("div", "pic"); const img = el("img"); img.src = u; img.alt = ""; d.append(img, btn("빼기", "sm", () => { images.splice(i, 1); drawPics(); })); pics.append(d); });
    pending.forEach((pp, i) => { const d = el("div", "pic"); const img = el("img"); img.src = pp.preview; img.alt = ""; d.append(img, btn("빼기", "sm", () => { URL.revokeObjectURL(pp.preview); pending.splice(i, 1); drawPics(); })); pics.append(d); });
    picNote.textContent = (images.length + pending.length) + "/" + MAX_PICS;
  };
  fileInput.addEventListener("change", () => {
    const room = MAX_PICS - images.length - pending.length;
    const files = [...fileInput.files].filter(x => x.type.startsWith("image/"));
    files.slice(0, room).forEach(file => pending.push({ file, preview: URL.createObjectURL(file) }));
    msg.className = "msg err"; msg.textContent = files.length > room ? "사진은 글 하나에 " + MAX_PICS + "장까지 올릴 수 있어요." : "";
    fileInput.value = ""; drawPics();
  });
  drawPics();

  f.addEventListener("submit", async (e) => {
    e.preventDefault(); msg.className = "msg err";
    if (!title.value.trim()) { msg.textContent = "제목을 적어 주세요."; title.focus(); return; }
    sub.disabled = true;
    try {
      const uploaded = [];
      for (let i = 0; i < pending.length; i++) { msg.className = "msg"; msg.textContent = "사진 올리는 중 (" + (i + 1) + "/" + pending.length + ")"; uploaded.push(await api.uploadImage(pending[i].file)); }
      msg.textContent = "저장하는 중";
      const finalImages = [...images, ...uploaded];
      const nid = await api.savePost({ id, title: title.value.trim(), body: bodyIn.value.trim(), images: finalImages });
      const removed = original.filter(u => !finalImages.includes(u));
      if (removed.length) await api.removeImages(removed).catch(() => {});
      pending.forEach(pp => URL.revokeObjectURL(pp.preview));
      location.hash = "post-" + nid;
    } catch (err) { msg.className = "msg err"; msg.textContent = friendly(err); sub.disabled = false; }
  });
  title.focus();
}

function ytIdOf(u) {
  if (!u) return null;
  const m = String(u).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(u) ? u : null);
}

function showWorks() {
  const v = view(); v.textContent = "";
  v.append(chrome("My", "Works"));
  v.append(sticker("note", { right: "-28px", top: "44px", width: "70px", transform: "rotate(18deg)" }));
  const ul = el("ol", "works");
  (CONFIG.WORKS || []).forEach((wk, i) => {
    const no = String(i + 1).padStart(2, "0");
    const li = el("li", "work cv-" + (wk.color || (i % 2 ? "green" : "purple")));
    const link = el("div", "wrapcd");
    const row = el("div", "cdrow");
    const disc = el("div", "disc"); disc.setAttribute("aria-hidden", "true");
    const cs = el("div", "cdcase"); const cover = el("div", "cover");
    const vol = el("div", "vol"); vol.append(el("span", null, "VOL."), el("b", null, no));
    cover.append(vol, el("h3", "ktitle", wk.title), el("span", "brand", "MANGTONG RECORDS"));
    const deco = COVER_DECO[wk.deco] || COVER_DECO[i % 2 ? "shooting" : "cosmic"];
    deco.forEach(d => {
      const sp = el("span", "deco" + (d.float ? " float" : "")); sp.setAttribute("aria-hidden", "true");
      sp.style.cssText = `--m:url("${Y2K_IMG[d.src]}");left:${d.x}%;top:${d.y}%;width:${d.w}%;aspect-ratio:${d.ar || 1};transform:rotate(${d.r || 0}deg);opacity:${d.o ?? 1};--dc:${d.c || "#fff"}`;
      cover.prepend(sp);
    });
    cs.append(cover);
    row.append(disc, cs);
    const info = el("div", "cdinfo"); const left = el("div", "left");
    const single = wk.status === "단편";
    left.append(el("span", "track", single ? "SINGLE" : "ALBUM"));
    if (wk.status) left.append(el("span", "chip " + (wk.status === "완결" ? "done" : single ? "short" : "ing"), wk.status));
    let go;
    if (wk.url) { go = el("a", "btn sm go g", "POSTYPE ↗"); go.href = wk.url; go.target = "_blank"; go.rel = "noopener"; go.setAttribute("aria-label", wk.title + " 포스타입에서 보기"); go.addEventListener("click", (e) => e.stopPropagation()); }
    else go = el("span", "btn sm go off", "링크 준비 중");
    info.append(left, go);
    link.append(row, info);
    if (wk.desc) link.append(el("p", "desc body", wk.desc));
    li.append(link); ul.append(li);
    // 폰: 화면에 들어오면 CD가 살짝 빠져나와 돌아요
    // 마우스: 올리면 살짝 나오고, 벗어나면 (누르지 않았으면) 다시 들어가요
    li.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse" && !li.classList.contains("spin")) li.classList.add("peek"); });
    li.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse" && !li.classList.contains("spin")) li.classList.remove("peek"); });
    row.style.cursor = "pointer"; row.setAttribute("role", "button"); row.tabIndex = 0; row.setAttribute("aria-label", wk.title + " CD 꺼내기");
    const player = el("div", "nowplaying"); player.hidden = true; li.append(player);
    const ytId = ytIdOf(wk.yt);
    const stopMusic = () => { if (!player.hidden) { player.hidden = true; player.textContent = ""; Sound.unduck(li._wasBgm); } };
    const startMusic = () => {
      if (!ytId) return;
      li._wasBgm = Sound.duck();
      const { w, body } = win("NOW PLAYING · " + wk.title);
      const close = btn("X", "vclose"); close.setAttribute("aria-label", "음악 끄기");
      close.onclick = (e) => { e.stopPropagation(); li.classList.remove("spin", "peek"); stopMusic(); };
      w.querySelector(".wbar").append(close); w.querySelector(".wbar i").remove();
      const frame = document.createElement("iframe");
      frame.src = "https://www.youtube-nocookie.com/embed/" + ytId + "?autoplay=1&playsinline=1&rel=0&start=" + (wk.start || 0);
      frame.title = wk.title + " 음악"; frame.allow = "autoplay; encrypted-media; picture-in-picture"; frame.allowFullscreen = true;
      const box = el("div", "ytbox"); box.append(frame);
      body.append(box, el("span", "label muted", "CD를 다시 누르면 음악이 멈춰요"));
      player.append(w); player.hidden = false;
    };
    li._stop = () => { li.classList.remove("spin", "peek"); stopMusic(); };
    const toggle = () => {
      const on = !li.classList.contains("spin"); li.dataset.touched = "1";
      if (on) document.querySelectorAll(".work").forEach(o => { if (o !== li && o._stop && o.classList.contains("spin")) o._stop(); });
      li.classList.toggle("spin", on); li.classList.toggle("peek", on); Sound.sfx[on ? "open" : "click"]();
      if (on) startMusic(); else stopMusic();
    };
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  });
  if (!ul.children.length) ul.append(el("li", "box empty", "아직 등록된 작품이 없어요."));
  v.append(ul);
  if ("IntersectionObserver" in window && !matchMedia("(hover: hover)").matches) {
    const io = new IntersectionObserver((es) => es.forEach(e => { if (!e.target.dataset.touched) e.target.classList.toggle("peek", e.isIntersecting); }), { threshold: .6 });
    ul.querySelectorAll(".work").forEach(x => io.observe(x));
  }
  v.append(sticker("bolt", { right: "110px", top: "-4px", width: "44px", transform: "rotate(14deg)" }));
}

/* ---------- 관리자 로그인 ---------- */
function showAdmin() {
  const v = view(); v.textContent = "";
  const { w, body } = win("ADMIN_LOGIN.EXE");
  if (isAdmin) {
    body.append(el("span", "win-title", "WELCOME BACK"), el("p", "body", "관리자로 로그인돼 있어요. 글 탭에서 새 글을 쓰고, 방명록에서 답변을 달 수 있어요."));
    const a = el("a", "btn sm g", "새 글 쓰기"); a.href = "#write"; a.style.alignSelf = "flex-start"; body.append(a);
    v.append(w); return;
  }
  const email = el("input", "inp"); email.type = "email"; email.id = "adminEmail"; email.placeholder = "이메일"; email.autocomplete = "username";
  const pw = el("input", "inp"); pw.type = "password"; pw.id = "adminPw"; pw.placeholder = "비밀번호"; pw.autocomplete = "current-password";
  if (api.demo) { email.value = "preview@example.com"; pw.value = "preview"; }
  const row = el("div", "row"); row.append(email, pw);
  const msg = el("p", "msg err");
  const go = btn("로그인", "g", async () => {
    go.disabled = true; msg.textContent = "";
    try {
      const ok = await api.login(email.value.trim(), pw.value);
      if (!ok) { msg.textContent = "로그인은 됐지만 관리자 이메일로 등록돼 있지 않아요."; await api.logout(); go.disabled = false; return; }
      await refreshAdmin(); location.hash = "posts";
    } catch (e) { msg.textContent = friendly(e); go.disabled = false; }
  });
  pw.addEventListener("keydown", (e) => { if (e.key === "Enter") go.click(); });
  const foot = el("div", "foot"); foot.append(msg, go);
  body.append(el("span", "win-title", "SIGN ON"), row, foot);
  v.append(w);
}

/* ---------- 낮·밤 모드 ---------- */
const DayNight = (() => {
  const autoMode = () => { const h = new Date().getHours(); return (h >= 22 || h < 7) ? "night" : "day"; };
  const pick = () => { try { const v = sessionStorage.getItem("mt-mode"); if (v === "day" || v === "night") return v; } catch {} return autoMode(); };
  const apply = (m) => {
    document.documentElement.dataset.mode = m;
    const b = $("modeBtn"); if (b) { b.textContent = m === "night" ? "☾ NIGHT" : "☀ DAY"; b.setAttribute("aria-pressed", String(m === "night")); }
    const d = new Date(); $("moonTag").textContent = "☾ NIGHT MODE " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = m === "night" ? "#0f1028" : "#e8e7e3";
  };
  function init() {
    apply(pick());
    $("modeBtn").addEventListener("click", () => {
      const next = document.documentElement.dataset.mode === "night" ? "day" : "night";
      try { sessionStorage.setItem("mt-mode", next); } catch {}
      apply(next); Sound.sfx.open();
    });
    setInterval(() => apply(pick()), 60000);   // 1분마다 시간 확인 (밤 10시가 되면 자동으로 바뀜)
  }
  return { init };
})();

/* ---------- 대문: 처음 들어올 때 한 번만 ---------- */
function openDoor() {
  const h = location.hash.slice(1);
  let seen = false;
  try { seen = sessionStorage.getItem("mt-entered") === "1"; } catch {}
  if (seen || (h && h !== "posts")) return;          // 특정 글·방명록 링크로 왔으면 건너뛰기
  const door = $("door"), bar = $("pbar"), pct = $("doorPct"), enter = $("doorEnter");
  for (let i = 0; i < 20; i++) bar.append(el("i"));
  door.hidden = false; document.body.classList.add("door-open");
  const cells = [...bar.children];
  const finish = () => {
    cells.forEach(c => c.classList.add("on")); pct.textContent = "99%";
    $("doorStatus").textContent = "READY"; $("doorText").textContent = "접속 완료! 들어오세요";
    enter.disabled = false; enter.focus();
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) finish();
  else {
    let n = 0;
    const tick = setInterval(() => {
      n++; cells.slice(0, n).forEach(c => c.classList.add("on"));
      pct.textContent = Math.min(99, Math.round(n / 20 * 99)) + "%";
      if (n >= 20) { clearInterval(tick); finish(); }
    }, 70);
  }
  const leave = (withSound) => {
    try { sessionStorage.setItem("mt-entered", "1"); } catch {}
    if (withSound) { Sound.start(); Sound.sfx.send(); } else Sound.mute();
    door.classList.add("leaving"); document.body.classList.remove("door-open");
    setTimeout(() => { door.hidden = true; }, 460);
  };
  enter.onclick = () => leave(true);
  $("doorQuiet").onclick = () => leave(false);
}

async function refreshAdmin() {
  isAdmin = await api.isAdmin().catch(() => false);
  $("adminBar").hidden = !isAdmin;
}

/* ---------- 화면 전환 ---------- */
async function route() {
  const h = location.hash.slice(1) || "posts";
  const tab = h === "guestbook" ? "guestbook" : h === "works" ? "works" : (h === "admin" ? "" : "posts");
  document.title = CONFIG.NAME + (tab === "guestbook" ? " · YOU" : tab === "posts" ? " · ME" : tab === "works" ? " · WORKS" : "");
  const inYou = h === "guestbook" || h === "works";
  $("adminWrite").hidden = inYou || h === "write" || /^edit-/.test(h);
  $("adminHint").textContent = h === "works" ? "작품 목록은 index.html 설정의 WORKS 에서 고쳐요" : inYou ? "방명록마다 있는 '답변하기'로 답할 수 있어요" : (h === "write" || /^edit-/.test(h)) ? "ME에 올릴 글을 쓰는 중이에요" : "";
  document.querySelectorAll(".nav .btn").forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle("on", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (h === "guestbook") return showGuestbook();
  if (h === "works") return showWorks();
  if (h === "admin") return showAdmin();
  if (h === "write") return showEditor(null);
  let m;
  if ((m = h.match(/^post-(\d+)$/))) return showPost(+m[1]);
  if ((m = h.match(/^edit-(\d+)$/))) return showEditor(+m[1]);
  return showPosts();
}

(async function start() {
  $("logoImg").alt = CONFIG.NAME;
  $("footName").textContent = CONFIG.NAME;
  $("year").textContent = new Date().getFullYear();
  $("topInfo").append(el("b", null, CONFIG.HANDLE), el("br"), el("span", null, CONFIG.SITE));
  document.title = CONFIG.NAME;
  const configured = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY;
  try { api = configured ? await supabaseApi() : demoApi(); } catch { api = demoApi(); }
  $("demoBanner").hidden = !api.demo;
  $("logoutBtn").onclick = async () => { await api.logout(); await refreshAdmin(); route(); };
  Sound.init();
  DayNight.init();
  openDoor();
  await refreshAdmin();
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
  await route();
})();
</script>
