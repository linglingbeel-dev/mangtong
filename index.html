@font-face { font-family: "Galmuri11"; src: url("fonts/Galmuri11.woff2") format("woff2"); font-display: swap; }

:root {

  --box: #ecebe7;
  --win: #dcdcd9;
  --winbar: #c9c9c5;
  --ink: #222222;

* { box-sizing: border-box; }

  font-family: var(--f-pixel); font-size: 13px; line-height: 1.7;
  padding-left: max(14px, env(safe-area-inset-left, 0px));

  padding-block: 14px 40px;
  word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: .45; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.wrap { max-width: 560px; margin: 0 auto; position: relative; }

/* ---------- 머리 ---------- */

.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav .btn[data-tab] { font-family: var(--f-label); font-size: 12px; letter-spacing: .06em; min-width: 52px; }
.btn.sound { font-family: var(--f-label); font-size: 10px; letter-spacing: .04em; gap: 6px; }

.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
.eq i { width: 3px; height: 3px; background: var(--ink); }

.btn.sound[aria-pressed="true"] .eq i:nth-child(2) { animation-delay: -.3s; }
.btn.sound[aria-pressed="true"] .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { 0% { height: 3px; } 25% { height: 11px; } 50% { height: 6px; } 75% { height: 9px; } 100% { height: 3px; } }
@media (prefers-reduced-motion: reduce) { .btn.sound[aria-pressed="true"] .eq i { animation: none; height: 8px; } }

/* ---------- 물결 판 ---------- */
.stage { position: relative; margin-top: 14px; border: 1.5px solid transparent;

.ktitle { font-family: var(--f-pixel-big); font-weight: 400; color: #c9f5b4; -webkit-text-stroke: 5px var(--green-ink); paint-order: stroke fill;
  text-shadow: 3px 3px 0 var(--green-ink); line-height: 1.25; margin: 0; text-wrap: balance; }

/* ---------- 사진 칸 ---------- */
.pgrid { display: grid; gap: 10px; }

.pgrid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }

.inline { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 4px; }

  animation: spark var(--t, .75s) ease-out forwards; }

  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }

}

/* ---------- 사진 크게 보기 ---------- */
.article .pgrid img, .photos-all img { cursor: zoom-in; }

  padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); }

/* ---------- 글쓰기 ---------- */
.pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }

@media (min-width: 520px) {

}

async function shrink(file) {
  if (file.type === "image/gif") return file;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return (await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85))) || file;
  } catch { return file; }
}

  g.fillStyle = lin; g.fillRect(0, 0, 800, 800);
  [[560, 260, 170, glow], [200, 560, 220, "rgba(255,255,255,.35)"], [150, 180, 40, "rgba(255,250,230,.9)"]].forEach(([x, y, r, col]) => {
    const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col); rg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = rg; g.fillRect(0, 0, 800, 800);
  });
  return c.toDataURL("image/jpeg", 0.8);
}

/* ---------- 저장소: Supabase ---------- */
function loadScript(src) { return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail; document.head.append(s); }); }
async function supabaseApi() {
  await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js");
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  const rpc = async (fn, args) => ok(await sb.rpc(fn, args));
  const store = sb.storage.from(BUCKET);
  const pathOf = (url) => { const i = url.indexOf("/" + BUCKET + "/"); return i < 0 ? null : decodeURIComponent(url.slice(i + BUCKET.length + 2)); };
  return {
    demo: false,
    listPosts: (before) => rpc("p_list", { p_limit: PAGE, p_before: before ?? null }),
    getPost: async (id) => ok(await sb.from("posts").select("*").eq("id", id).maybeSingle()),
    async savePost({ id, title, body, images }) {
      if (id) { ok(await sb.from("posts").update({ title, body, images, updated_at: new Date().toISOString() }).eq("id", id)); return id; }
      return ok(await sb.from("posts").insert({ title, body, images }).select("id").single()).id;
    },
    async deletePost(id) { const p = await this.getPost(id); ok(await sb.from("posts").delete().eq("id", id)); if (p && p.images.length) await this.removeImages(p.images); },
    async uploadImage(file) {
      const blob = await shrink(file);
      const ext = blob.type === "image/gif" ? "gif" : blob.type === "image/png" ? "png" : "jpg";
      const path = new Date().toISOString().slice(0, 7) + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
      ok(await store.upload(path, blob, { contentType: blob.type || "image/jpeg", cacheControl: "31536000" }));
      return store.getPublicUrl(path).data.publicUrl;
    },
    async removeImages(urls) { const paths = urls.map(pathOf).filter(Boolean); if (paths.length) await store.remove(paths); },
    listComments: (postId) => rpc("c_list", { p_post_id: postId }),
    addComment: ({ postId, nickname, password, content, parentId }) => rpc("c_add", Object.assign({ p_post_id: postId, p_nickname: nickname, p_password: password, p_content: content }, parentId != null ? { p_parent_id: parentId } : {})),
    deleteComment: (id, pw) => rpc("c_delete", { p_id: id, p_password: pw }),
    authorComment: (postId, content, parentId) => rpc("c_author_add", Object.assign({ p_post_id: postId, p_content: content }, parentId != null ? { p_parent_id: parentId } : {})),
    adminDeleteComment: (id) => rpc("c_admin_delete", { p_id: id }),
    gbList: (before) => rpc("gb_list", { p_limit: PAGE, p_before: before ?? null }),
    gbAdd: ({ nickname, password, content, secret }) => rpc("gb_add", { p_nickname: nickname, p_password: password, p_content: content, p_secret: secret }),
    gbDelete: (id, pw) => rpc("gb_delete", { p_id: id, p_password: pw }),
    gbOpen: async (id, pw) => { const d = await rpc("gb_open", { p_id: id, p_password: pw }); return d && d.length ? d[0] : null; },
    gbReply: (id, text) => rpc("gb_reply", { p_id: id, p_reply: text }),
    gbHide: (id, v) => rpc("gb_set_hidden", { p_id: id, p_hidden: v }),
    gbAdminDelete: (id) => rpc("gb_admin_delete", { p_id: id }),
    async login(email, pw) { ok(await sb.auth.signInWithPassword({ email, password: pw })); return this.isAdmin(); },
    async logout() { await sb.auth.signOut(); },
    async isAdmin() { const { data } = await sb.auth.getSession(); if (!data.session) return false; return !!(await rpc("is_admin")); },
  };
}

const Sound = (() => {
  let on = true, ctx = null, started = false;
  try { on = localStorage.getItem("mt-sound") !== "off"; } catch {}
  const bgm = () => $("bgm");
  const ac = () => { if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (C) ctx = new C(); } if (ctx && ctx.state === "suspended") ctx.resume(); return ctx; };
  function tone(freqs, step = 0.055, type = "square", vol = 0.06) {
    if (!on) return; const c = ac(); if (!c) return;
    const t0 = c.currentTime + 0.005;
    freqs.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0 + i * step);
      g.gain.setValueAtTime(0, t0 + i * step); g.gain.linearRampToValueAtTime(vol, t0 + i * step + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * step + step * 0.95);
      o.connect(g).connect(c.destination); o.start(t0 + i * step); o.stop(t0 + (i + 1) * step);
    });
  }
  const sfx = {
    click: () => tone([880], 0.05),
    nav: () => tone([660, 990], 0.05),
    send: () => tone([988, 1319], 0.07),            // 코인 소리
    open: () => tone([523, 659, 784], 0.045),
    del: () => tone([392, 262], 0.08, "square", 0.05),
    error: () => tone([196, 147], 0.1, "square", 0.05),
  };
  function ui() {
    const b = $("soundBtn"); if (!b) return;
    const playing = on && started && !bgm().paused;
    b.setAttribute("aria-pressed", String(playing));
    $("soundLabel").textContent = playing ? "NOW PLAYING" : on ? "BGM ▶" : "BGM OFF";
  }
  async function play() { try { await bgm().play(); started = true; } catch {} ui(); }
  function set(v) {
    on = v; try { localStorage.setItem("mt-sound", v ? "on" : "off"); } catch {}
    if (v) play(); else { bgm().pause(); } ui();
  }
  function init() {
    const a = bgm(); a.volume = 0.45;
    a.addEventListener("play", ui); a.addEventListener("pause", ui);
    $("soundBtn").addEventListener("click", (e) => { e.stopPropagation(); const playing = on && started && !a.paused; if (playing) set(false); else { set(true); sfx.open(); } });
    // 처음 아무 곳이나 누르면 음악 시작 (꺼 두었으면 그대로)
    const first = () => { if (on && !started) play(); };
    document.addEventListener("pointerdown", first, { once: true });
    document.addEventListener("keydown", first, { once: true });
    // 버튼·링크 누를 때 효과음
    document.addEventListener("click", (e) => {
      const t = e.target.closest("a, button, label.file, input[type=checkbox]");
      if (!t || t.id === "soundBtn") return;
      if (t.matches("[data-tab], .logo, .post-card, .btn[href^='#']")) sfx.nav();
      else if (t.matches("button[type=submit]")) sfx.send();
      else if (t.matches(".danger")) sfx.del();
      else sfx.click();
    }, true);
    ui();
  }
  return { init, sfx, start: () => set(true), mute: () => set(false), isOn: () => on };
})();

/* 작은 입력창 (비밀번호 확인, 답변 쓰기 등) */
function inlinePrompt(container, { placeholder, type = "password", multiline = false, value = "", okLabel, okClass = "", onOk }) {
  container.textContent = "";
  const box = el("div", "inline");
  const input = el(multiline ? "textarea" : "input", "inp");
  if (!multiline) input.type = type;
  input.placeholder = placeholder; input.value = value;
  const go = btn(okLabel, "sm " + okClass), cancel = btn("취소", "sm", () => { container.textContent = ""; });
  const msg = el("p", "msg err");
  const run = async () => {
    go.disabled = true; msg.textContent = "";
    try { const r = await onOk(input.value); if (r === false) { msg.textContent = "비밀번호가 맞지 않아요."; Sound.sfx.error(); go.disabled = false; } }
    catch (e) { msg.textContent = friendly(e); go.disabled = false; }
  };
  go.onclick = run;
  if (!multiline) input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } });
  box.append(input, go, cancel); container.append(box, msg); input.focus();
}
function confirmInline(container, text, label, onYes) {
  container.textContent = "";
  const box = el("div", "inline");
  const yes = btn(label, "sm danger", async () => { yes.disabled = true; try { await onYes(); } catch (e) { box.append(el("span", "msg err", friendly(e))); yes.disabled = false; } });
  box.append(el("span", "msg", text), yes, btn("취소", "sm", () => { container.textContent = ""; }));
  container.append(box);
}

/* 방문자 글쓰기 폼 (댓글·방명록 공용) */
function visitorForm({ placeholder, withSecret, submitLabel, submitCls, onSubmit }) {
  const f = el("form"); f.noValidate = true; f.style.cssText = "display:flex;flex-direction:column;gap:7px";
  const row = el("div", "row");
  const nick = el("input", "inp"); nick.type = "text"; nick.maxLength = 20; nick.placeholder = "닉네임"; nick.autocomplete = "nickname";
  const pw = el("input", "inp"); pw.type = "password"; pw.maxLength = 40; pw.placeholder = "비밀번호 (4자 이상)"; pw.autocomplete = "new-password";
  row.append(nick, pw);
  const hp = el("input", "hp"); hp.type = "text"; hp.tabIndex = -1; hp.autocomplete = "off"; hp.setAttribute("aria-hidden", "true");
  const ta = el("textarea", "inp"); ta.maxLength = 2000; ta.placeholder = placeholder;
  const foot = el("div", "foot");
  const secretLabel = el("label", "check"); const secret = el("input"); secret.type = "checkbox";
  secretLabel.append(secret, "비밀글");
  const count = el("span", "count", "0/2000");
  ta.addEventListener("input", () => { count.textContent = ta.value.length + "/2000"; });
  const sub = el("button", "btn " + (submitCls || "g"), submitLabel); sub.type = "submit";
  const left = el("div", "acts"); left.append(withSecret ? secretLabel : count);
  foot.append(left, sub);
  const msg = el("p", "msg err"); msg.setAttribute("role", "status");
  f.append(row, hp, ta, foot, msg);
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); msg.className = "msg err";
    if (hp.value) return;
    const n = nick.value.trim(), p = pw.value, c = ta.value.trim();
    if (!n) { msg.textContent = "닉네임을 적어 주세요."; nick.focus(); return; }
    if (p.length < 4) { msg.textContent = "비밀번호는 4자 이상으로 정해 주세요."; pw.focus(); return; }
    if (!c) { msg.textContent = "내용을 적어 주세요."; ta.focus(); return; }
    sub.disabled = true; msg.textContent = "";
    try {
      await onSubmit({ nickname: n, password: p, content: c, secret: secret.checked });
      ta.value = ""; secret.checked = false; count.textContent = "0/2000";
      msg.className = "msg"; msg.textContent = "남겼어요.";
    } catch (err) { msg.textContent = friendly(err); }
    sub.disabled = false;
  });
  return f;
}

function photoGrid(images) {
  const n = Math.min(images.length, 3);
  const g = el("div", "pgrid n" + n);
  images.slice(0, 3).forEach((u, i) => {
    const ph = el("div", "ph"); const img = el("img"); img.src = u; img.alt = ""; img.loading = "lazy"; ph.append(img);
    if (i === 2 && images.length > 3) ph.append(el("span", "more-ph", "+" + (images.length - 3)));
    g.append(ph);
  });
  return g;
}

/* ---------- 반짝이 커서 (마우스·손가락 지나간 자리에 별) ---------- */
(function sparkles() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#8f6fdc", "#b5ee9c", "#ffffff", "#b9a2f0", "#ffc2e4", "#8fc8ff"];
  let live = 0, last = 0;
  const spawn = (x, y, burst) => {
    if (live > 40) return;
    const sp = document.createElement("span"); sp.className = "spark"; sp.setAttribute("aria-hidden", "true");
    const r = (a, b) => a + Math.random() * (b - a);
    const size = burst ? r(14, 24) : r(10, 18);
    sp.style.cssText = `--x:${x - size / 2 + r(-6, 6)}px;--y:${y - size / 2 + r(-6, 6)}px;--dx:${burst ? r(-40, 40) : r(-12, 12)}px;--dy:${burst ? r(-40, 30) : r(8, 26)}px;--s:${size}px;--c:${colors[Math.floor(Math.random() * colors.length)]};--t:${r(.55, .9)}s`;
    sp.append(document.createElement("i"));
    live++; document.body.append(sp);
    sp.addEventListener("animationend", () => { sp.remove(); live--; }, { once: true });
  };
  const trail = (x, y) => { const now = performance.now(); if (now - last < 32) return; last = now; spawn(x, y, false); };
  document.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") trail(e.clientX, e.clientY); }, { passive: true });
  document.addEventListener("touchmove", (e) => { const t = e.touches[0]; if (t) trail(t.clientX, t.clientY); }, { passive: true });
  document.addEventListener("pointerdown", (e) => { for (let k = 0; k < 6; k++) spawn(e.clientX, e.clientY, true); }, { passive: true });
})();

/* ---------- 사진 크게 보기 ---------- */
function openViewer(images, start, title) {
  let i = start;
  const ov = el("div", "viewer"); ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-label", "사진 크게 보기");
  const w = el("section", "win");
  const bar = el("div", "wbar"); const name = el("span"); const close = btn("X", "vclose"); close.setAttribute("aria-label", "닫기");
  bar.append(name, close);
  const stage = el("div", "vstage"); const img = el("img"); stage.append(img);
  const foot = el("div", "vfoot");
  const prev = btn("◀ PREV", "sm"), next = btn("NEXT ▶", "sm"), count = el("span", "lcd");
  const hint = el("span", "hint", "사진을 누르면 실제 크기로 봐요");
  const mid = el("div"); mid.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:2px"; mid.append(count, hint);
  foot.append(prev, mid, next);
  w.append(bar, stage, foot); ov.append(w);
  const show = () => {
    stage.classList.remove("actual"); stage.scrollTo(0, 0);
    img.src = images[i]; img.alt = title + " 사진 " + (i + 1);
    name.textContent = "IMG_" + String(i + 1).padStart(3, "0") + ".JPG";
    count.textContent = (i + 1) + " / " + images.length;
    prev.disabled = i === 0; next.disabled = i === images.length - 1;
    prev.style.visibility = next.style.visibility = images.length > 1 ? "visible" : "hidden";
  };
  const go = (d) => { const n = i + d; if (n < 0 || n >= images.length) return; i = n; Sound.sfx.click(); show(); };
  const shut = () => { ov.remove(); document.body.classList.remove("viewer-open"); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") shut(); else if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1); };
  prev.onclick = () => go(-1); next.onclick = () => go(1); close.onclick = shut;
  ov.addEventListener("click", (e) => { if (e.target === ov) shut(); });
  img.addEventListener("click", () => { stage.classList.toggle("actual"); });
  // 휴대폰: 옆으로 밀어서 넘기기
  let sx = null, sy = 0;
  stage.addEventListener("touchstart", (e) => { if (e.touches.length === 1 && !stage.classList.contains("actual")) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (sx == null) return; const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  });
  document.addEventListener("keydown", onKey);
  document.body.append(ov); document.body.classList.add("viewer-open");
  show(); close.focus();
}

  const f = el("form"); f.noValidate = true; f.style.cssText = "display:flex;flex-direction:column;gap:8px";
  const title = el("input", "inp"); title.type = "text"; title.id = "pTitle"; title.maxLength = 100; title.placeholder = "제목"; title.value = post.title;
  const bodyIn = el("textarea", "inp"); bodyIn.id = "pBody"; bodyIn.maxLength = 20000; bodyIn.placeholder = "내용"; bodyIn.value = post.body;
  const pics = el("div", "pics");
  const fileLabel = el("label", "btn sm file"); const fileInput = el("input"); fileInput.type = "file"; fileInput.accept = "image/*"; fileInput.multiple = true; fileInput.id = "pFiles";
  fileLabel.append(fileInput, "사진 추가");
  const picNote = el("span", "count");
  const picRow = el("div", "acts"); picRow.append(fileLabel, picNote);
  const foot = el("div", "foot"); const msg = el("p", "msg err"); const sub = el("button", "btn g", id ? "수정 저장" : "올리기"); sub.type = "submit";
  foot.append(msg, sub);
  f.append(title, bodyIn, picRow, pics, foot);
  body.append(f); v.append(w);

  const drawPics = () => {
    pics.textContent = "";
    images.forEach((u, i) => { const d = el("div", "pic"); const img = el("img"); img.src = u; img.alt = ""; d.append(img, btn("빼기", "sm", () => { images.splice(i, 1); drawPics(); })); pics.append(d); });
    pending.forEach((pp, i) => { const d = el("div", "pic"); const img = el("img"); img.src = pp.preview; img.alt = ""; d.append(img, btn("빼기", "sm", () => { URL.revokeObjectURL(pp.preview); pending.splice(i, 1); drawPics(); })); pics.append(d); });
    picNote.textContent = (images.length + pending.length) + "/" + MAX_PICS;
  };
  fileInput.addEventListener("change", () => {
    const room = MAX_PICS - images.length - pending.length;
    const files = [...fileInput.files].filter(x => x.type.startsWith("image/"));
    files.slice(0, room).forEach(file => pending.push({ file, preview: URL.createObjectURL(file) }));
    msg.className = "msg err"; msg.textContent = files.length > room ? "사진은 글 하나에 " + MAX_PICS + "장까지 올릴 수 있어요." : "";
    fileInput.value = ""; drawPics();
  });
  drawPics();

  f.addEventListener("submit", async (e) => {
    e.preventDefault(); msg.className = "msg err";
    if (!title.value.trim()) { msg.textContent = "제목을 적어 주세요."; title.focus(); return; }
    sub.disabled = true;
    try {
      const uploaded = [];
      for (let i = 0; i < pending.length; i++) { msg.className = "msg"; msg.textContent = "사진 올리는 중 (" + (i + 1) + "/" + pending.length + ")"; uploaded.push(await api.uploadImage(pending[i].file)); }
      msg.textContent = "저장하는 중";
      const finalImages = [...images, ...uploaded];
      const nid = await api.savePost({ id, title: title.value.trim(), body: bodyIn.value.trim(), images: finalImages });
      const removed = original.filter(u => !finalImages.includes(u));
      if (removed.length) await api.removeImages(removed).catch(() => {});
      pending.forEach(pp => URL.revokeObjectURL(pp.preview));
      location.hash = "post-" + nid;
    } catch (err) { msg.className = "msg err"; msg.textContent = friendly(err); sub.disabled = false; }
  });
  title.focus();
}

/* ---------- 방명록 ---------- */
async function showGuestbook() {
  const v = view(); v.textContent = "";
  v.append(chrome("Dear", "You"));
  v.append(sticker("bolt", { right: "-20px", top: "-12px", width: "54px", transform: "rotate(10deg)" }));
  const list = el("div", "gb-list");
  const more = btn("이전 글 더 보기", "more"); more.hidden = true;
  let oldest = null;
  const load = async () => {
    try {
      const rows = await api.gbList(oldest);
      if (!rows.length && !list.children.length) list.append(el("p", "box empty", "아직 방명록이 비어 있어요. 첫 글을 남겨 주세요."));
      rows.forEach(r => list.append(gbItem(r)));
      if (rows.length) oldest = rows[rows.length - 1].id;
      more.hidden = rows.length < PAGE;
    } catch (e) { list.append(el("p", "box empty", "불러오지 못했어요. " + friendly(e))); }
  };
  const reload = async () => { oldest = null; list.textContent = ""; await load(); };
  more.onclick = load;

  function gbItem(r) {
    const item = el("div", "box pad gb-item" + (r.content == null || (r.is_secret && isAdmin) ? " mint" : "") + (r.hidden ? " hidden-item" : ""));
    const r1 = el("div", "row1");
    const who = el("span", "who", r.nickname);
    if (r.is_secret) who.append(el("span", "tag", "SECRET"));
    if (r.hidden) who.append(el("span", "tag", "HIDDEN"));
    r1.append(who, el("span", "lcd", lcdShort(r.created_at)));
    const bodyWrap = el("div"), replyWrap = el("div");
    const show = (content, reply) => {
      bodyWrap.textContent = ""; bodyWrap.append(el("p", "body", content));
      replyWrap.textContent = "";
      if (reply) { const rp = el("div", "reply"); rp.append(el("b", null, CONFIG.NAME), document.createTextNode(reply)); replyWrap.append(rp); }
    };
    if (r.content == null) bodyWrap.append(el("p", "locked", "🔒 " + CONFIG.NAME + "에게만 보이는 비밀글이에요"));
    else show(r.content, r.reply);
    item.append(r1, bodyWrap, replyWrap);
    const acts = el("div", "acts"), slot = el("div");
    if (r.content == null) acts.append(btn("비밀번호로 열기", "sm", () => inlinePrompt(slot, { placeholder: "글 비밀번호", okLabel: "열기",
      onOk: async (pw) => { const d = await api.gbOpen(r.id, pw); if (!d) return false; show(d.content, d.reply); slot.textContent = ""; } })));
    if (isAdmin) {
      acts.append(
        btn(r.reply ? "답변 고치기" : "답변하기", "sm p", () => inlinePrompt(slot, { placeholder: "답변을 적어 주세요. 비우고 저장하면 답변이 지워져요.", multiline: true, value: r.reply || "", okLabel: "저장", okClass: "p",
          onOk: async (text) => { await api.gbReply(r.id, text); await reload(); } })),
        btn(r.hidden ? "다시 보이기" : "숨기기", "sm", async () => { await api.gbHide(r.id, !r.hidden); await reload(); }),
        btn("삭제", "sm danger", () => confirmInline(slot, "지울까요? 되돌릴 수 없어요.", "삭제", async () => { await api.gbAdminDelete(r.id); await reload(); })));
    } else {
      acts.append(btn("내 글 지우기", "sm", () => inlinePrompt(slot, { placeholder: "글 비밀번호", okLabel: "삭제", okClass: "danger",
        onOk: async (pw) => { const ok = await api.gbDelete(r.id, pw); if (!ok) return false; await reload(); } })));
    }
    item.append(acts, slot);
    return item;
  }

  if (!isAdmin) {
    const { w, body } = win("GUESTBOOK.EXE");
    body.append(el("span", "win-title", "LEAVE A NOTE"));
    body.append(visitorForm({ placeholder: CONFIG.NAME + "에게 하고 싶은 말이나 질문을 적어 주세요", withSecret: true, submitLabel: "CHECK INBOX ✉", submitCls: "g",
      onSubmit: async (d) => { await api.gbAdd(d); await reload(); } }));
    v.append(w);
  }
  v.append(list, more);
  const h = heart("line"); h.style.marginTop = "4px"; v.append(h);
  v.append(sticker("note", { right: "-30px", bottom: "10px", width: "88px", transform: "rotate(22deg)" }));
  v.append(sticker("note", { left: "-30px", bottom: "40px", width: "64px", transform: "rotate(-10deg)" }));
  await load();
}

/* ---------- 대문: 처음 들어올 때 한 번만 ---------- */
function openDoor() {
  const h = location.hash.slice(1);
  let seen = false;
  try { seen = sessionStorage.getItem("mt-entered") === "1"; } catch {}
  if (seen || (h && h !== "posts")) return;          // 특정 글·방명록 링크로 왔으면 건너뛰기
  const door = $("door"), bar = $("pbar"), pct = $("doorPct"), enter = $("doorEnter");
  for (let i = 0; i < 20; i++) bar.append(el("i"));
  door.hidden = false; document.body.classList.add("door-open");
  const cells = [...bar.children];
  const finish = () => {
    cells.forEach(c => c.classList.add("on")); pct.textContent = "99%";
    $("doorStatus").textContent = "READY"; $("doorText").textContent = "접속 완료! 들어오세요";
    enter.disabled = false; enter.focus();
  };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) finish();
  else {
    let n = 0;
    const tick = setInterval(() => {
      n++; cells.slice(0, n).forEach(c => c.classList.add("on"));
      pct.textContent = Math.min(99, Math.round(n / 20 * 99)) + "%";
      if (n >= 20) { clearInterval(tick); finish(); }
    }, 70);
  }
  const leave = (withSound) => {
    try { sessionStorage.setItem("mt-entered", "1"); } catch {}
    if (withSound) { Sound.start(); Sound.sfx.send(); } else Sound.mute();
    door.classList.add("leaving"); document.body.classList.remove("door-open");
    setTimeout(() => { door.hidden = true; }, 460);
  };
  enter.onclick = () => leave(true);
  $("doorQuiet").onclick = () => leave(false);
}

async function refreshAdmin() {
  isAdmin = await api.isAdmin().catch(() => false);
  $("adminBar").hidden = !isAdmin;
}

/* ---------- 화면 전환 ---------- */
async function route() {
  const h = location.hash.slice(1) || "posts";
  const tab = h === "guestbook" ? "guestbook" : (h === "admin" ? "" : "posts");
  document.title = CONFIG.NAME + (tab === "guestbook" ? " · YOU" : tab === "posts" ? " · ME" : "");
  const inYou = h === "guestbook";
  $("adminWrite").hidden = inYou || h === "write" || /^edit-/.test(h);
  $("adminHint").textContent = inYou ? "방명록마다 있는 '답변하기'로 답할 수 있어요" : (h === "write" || /^edit-/.test(h)) ? "ME에 올릴 글을 쓰는 중이에요" : "";
  document.querySelectorAll(".nav .btn").forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle("on", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (h === "guestbook") return showGuestbook();
  if (h === "admin") return showAdmin();
  if (h === "write") return showEditor(null);
  let m;
  if ((m = h.match(/^post-(\d+)$/))) return showPost(+m[1]);
  if ((m = h.match(/^edit-(\d+)$/))) return showEditor(+m[1]);
  return showPosts();
}

(async function start() {
  $("logoImg").alt = CONFIG.NAME;
  $("footName").textContent = CONFIG.NAME;
  $("year").textContent = new Date().getFullYear();
  $("topInfo").append(el("b", null, CONFIG.HANDLE), el("br"), el("span", null, CONFIG.SITE));
  document.title = CONFIG.NAME;
  const configured = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY;
  try { api = configured ? await supabaseApi() : demoApi(); } catch { api = demoApi(); }
  $("demoBanner").hidden = !api.demo;
  $("logoutBtn").onclick = async () => { await api.logout(); await refreshAdmin(); route(); };
  Sound.init();
  openDoor();
  await refreshAdmin();
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
  await route();
})();
